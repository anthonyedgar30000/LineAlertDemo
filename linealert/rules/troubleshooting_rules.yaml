# Rules are intentionally deterministic. They match drift evidence by key,
# direction, and minimum drift before recommending checks.
rules:
  - issue: "Product transfer is delayed after tamp extension"
    conditions:
      all:
        - observation_key: "lag:TampExtend->ProductTransfer"
          direction: "high"
          min_drift_seconds: 1.0
    recommendations:
      - "Inspect the TampExtend subsystem for incomplete extension or slow retract clearance."
      - "Check product transfer sensors and mechanical handoff after tamp extension."
      - "Verify downstream transfer permissives are not delaying release."
