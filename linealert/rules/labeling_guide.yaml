# Deterministic knowledge base extracted from the attached Labeling
# Troubleshooting Guide image. This file contains no AI or machine-learning
# logic; it is structured expert-system content for checks and actions.
guide:
  name: "Labeling Troubleshooting Guide"
  purpose: "Identify labeling symptoms, ask checks, recommend actions, suggest related issues, and escalate when required."
  source: "User-provided troubleshooting guide image"
  how_to_use:
    - "Identify the issue you are seeing."
    - "Follow the questions/checks in that column."
    - "Make the recommended adjustments."
    - "If the issue remains, move to related areas shown by arrows."

rules:
  - id: "label_alignment_off"
    issue: "Label Alignment is Off"
    symptom:
      name: "Label Alignment is Off"
      aliases:
        - "Label alignment off"
        - "Alignment off"
        - "Label is crooked"
        - "Crooked label"
      examples:
        - "Crooked label"
        - "Rotated label"
        - "Inconsistent placement"
        - "Drifting placement"
        - "Skewed left/right"
    checks:
      - "Peel tip square to bottle?"
      - "Is bottle stable during application?"
      - "Are guide rings centered?"
      - "Is issue constant or intermittent?"
      - "Does issue worsen at higher speed?"
    actions:
      - "Adjust Peel Angle"
      - "Adjust Hold Down"
      - "Check Guide Rings"
      - "Increase Label Delay"
      - "Reduce Speed Temporarily"
    related_issues:
      - symptom_id: "bubbles_on_labels"
        symptom: "Bubbles on Labels"
        reason: "Insufficient pressure time or unstable contact can create both bubbles and alignment errors."
    escalation_conditions:
      - "Issue continues after all adjustments."
      - "Multiple issues are occurring at the same time."
      - "Mechanical damage or worn parts are observed."
      - "Unusual noises or air leaks are present."
      - "Need replacement parts."
    key_adjustment_areas:
      - area: "Peel Angle"
        purpose: "Peel plate angle setting"
      - area: "Hold Down"
        purpose: "Hold-down pressure or position"
      - area: "Guide Rings"
        purpose: "Product guidance"
      - area: "Label Delay"
        purpose: "Timing of label application"
    key_point: "Alignment problems are usually caused by geometry, stability, or timing offset."

  - id: "label_has_folds"
    issue: "Label Has Folds"
    symptom:
      name: "Label Has Folds"
      aliases:
        - "Label folds"
        - "Folds"
        - "Wrinkled label"
        - "Label wrinkles"
      examples:
        - "Wrinkles"
        - "Folded edges"
        - "Label bunching"
        - "Uneven application"
    checks:
      - "Is label speed too high?"
      - "Is aligner speed too slow?"
      - "Are folds random or consistent?"
      - "Does reducing speed help?"
    actions:
      - "Decrease Label Speed"
      - "Increase Aligner Speed"
      - "Verify Product Stability"
      - "Reduce Conveyor Speed"
    related_issues:
      - symptom_id: "label_has_stretch_lines"
        symptom: "Label Has Stretch Lines"
        reason: "Folds and stretch lines can share a speed or tension mismatch."
    escalation_conditions:
      - "Issue continues after all adjustments."
      - "Multiple issues are occurring at the same time."
      - "Mechanical damage or worn parts are observed."
      - "Need replacement parts."
    key_adjustment_areas:
      - area: "Label Speed"
        purpose: "Label feed speed"
      - area: "Aligner Speed"
        purpose: "Aligner belt speed"
      - area: "Bottle Stability"
        purpose: "Product control during application"
      - area: "Conveyor Speed"
        purpose: "Container movement through labeler"
    key_point: "Folds are usually caused by speed mismatch or poor label setting."

  - id: "label_has_stretch_lines"
