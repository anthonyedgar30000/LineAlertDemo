        reason: "Stretch lines and folds can share a speed or tension mismatch."
      - symptom_id: "multiple_labels_applying"
        symptom: "Multiple Labels Applying"
        reason: "Feed or tension instability can affect sensor detection and label spacing."
    escalation_conditions:
      - "Issue continues after all adjustments."
      - "Multiple issues are occurring at the same time."
      - "Mechanical damage or worn parts are observed."
      - "Need replacement parts."
    key_adjustment_areas:
