      - area: "Aligner Speed"
        purpose: "Aligner belt speed"
      - area: "Feed Rollers"
        purpose: "Label feed contact and pull consistency"
      - area: "Label Tension"
        purpose: "Web tension during label feed"
    key_point: "Stretch lines are caused by excessive tension or feed speed mismatch."

  - id: "bubbles_on_labels"
